<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			if (sessionStorage.getItem('styxtype-cache'))
				document.documentElement.style.setProperty('--cache', 'none');
			sessionStorage.setItem('styxtype-cache', '1');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
